
name: Backend CI

on:
  push:
    branches:
      - main
      - upgrade/**
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Run tests and package application
        run: mvn -B --no-transfer-progress clean verify

      - name: Verify private application properties are excluded
        shell: bash
        run: |
          JAR="target/advanced_spring-0.0.1-SNAPSHOT.jar"

          if [[ ! -f "$JAR" ]]; then
            echo "Expected application JAR was not generated."
            exit 1
          fi

          if jar tf "$JAR" | grep -q '^BOOT-INF/classes/application.properties$'; then
            echo "ERROR: Private application.properties is packaged in the JAR."
            exit 1
          fi

          echo "PASS: Private application.properties is absent from the JAR."
