name: Backend CI

on:
  push:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backend-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Java tests, package and Docker image
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Run tests and package application
        run: mvn -B --no-transfer-progress clean verify

      - name: Verify private application properties are excluded
        shell: bash
        run: |
          JAR="target/advanced_spring-0.0.1-SNAPSHOT.jar"

          if [[ ! -f "$JAR" ]]; then
            echo "Expected application JAR was not generated."
            exit 1
          fi

          jar tf "$JAR" > target/jar-contents.txt

          if grep -Fxq 'BOOT-INF/classes/application.properties' target/jar-contents.txt; then
            echo "ERROR: Private application.properties is packaged in the JAR."
            exit 1
          fi

          echo "PASS: Private application.properties is absent from the JAR."

      - name: Build Docker image
        run: docker build --tag coupons-backend:ci .

      - name: Verify container user and Java runtime
        run: |
          docker run --rm --entrypoint sh coupons-backend:ci \
            -c 'test "$(id -u)" -ne 0 && java -version'